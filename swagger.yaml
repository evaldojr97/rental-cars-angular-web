openapi: 3.0.3
info:
  title: Rental Cars API
  description: |
    API REST para gestão de aluguéis de veículos em uma locadora.
    
    Esta API fornece endpoints para:
    - Listar aluguéis de veículos
    - Listar carros disponíveis
    - Processar arquivos de aluguéis (formato RTN)
    
    ## Autenticação
    A API utiliza autenticação via Keycloak. Inclua o token Bearer no header:
    ```
    Authorization: Bearer <seu-token>
    ```
    
  version: 1.0.0
  contact:
    name: Rental Cars Support
    email: support@rentalcars.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Servidor de desenvolvimento local  

paths:
  /api/alugueis/listar:
    get:
      tags:
        - Aluguéis
      summary: Listar todos os aluguéis
      description: Retorna uma lista completa de todos os aluguéis cadastrados no sistema
      operationId: listarAlugueis
      parameters:
        - name: pago
          in: query
          description: Filtrar aluguéis por status de pagamento
          required: false
          schema:
            type: string
            enum: [SIM, NAO]
        - name: dataInicio
          in: query
          description: Filtrar aluguéis a partir desta data (formato DD/MM/YYYY)
          required: false
          schema:
            type: string
            format: date
        - name: dataFim
          in: query
          description: Filtrar aluguéis até esta data (formato DD/MM/YYYY)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de aluguéis retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListarAlugueisResponse'
              example:
                alugueis:
                  - dataAluguel: "15/03/2024"
                    modeloCarro: "Gol G6"
                    kmCarro: 45000
                    nomeCliente: "João Silva"
                    telefoneCliente: "(11) 98765-4321"
                    dataDevolucao: "20/03/2024"
                    valor: 350.00
                    pago: "SIM"
                  - dataAluguel: "16/03/2024"
                    modeloCarro: "Fusca 1975"
                    kmCarro: 89000
                    nomeCliente: "Maria Santos"
                    telefoneCliente: "(21) 99876-5432"
                    dataDevolucao: "18/03/2024"
                    valor: 200.00
                    pago: "NAO"
                valorTotalNaoPago: 200.00
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado - Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/carros:
    get:
      tags:
        - Carros
      summary: Listar carros disponíveis
      description: Retorna uma lista de todos os carros cadastrados no sistema
      operationId: listarCarros
      responses:
        '200':
          description: Lista de carros retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Carro'
              example:
                - id: 1
                  modelo: "Gol G6"
                - id: 2
                  modelo: "Fusca 1975"
                - id: 3
                  modelo: "HB20"
                - id: 4
                  modelo: "Onix"
        '401':
          description: Não autorizado - Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alugueis/processar:
    post:
      tags:
        - Aluguéis
      summary: Processar arquivo de aluguéis
      description: |
        Processa um arquivo de aluguéis no formato RTN.
        
        O arquivo deve conter os dados dos aluguéis em formato específico.
        Após o processamento, os aluguéis serão cadastrados no sistema.
      operationId: processarArquivoAlugueis
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo RTN contendo os dados dos aluguéis
            encoding:
              file:
                contentType: text/plain, application/octet-stream
      responses:
        '200':
          description: Arquivo processado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Arquivo processado com sucesso. 150 aluguéis cadastrados."
                  totalRegistros:
                    type: integer
                    example: 150
                  registrosProcessados:
                    type: integer
                    example: 150
                  registrosRejeitados:
                    type: integer
                    example: 0
        '400':
          description: Arquivo inválido ou formato incorreto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "INVALID_FILE_FORMAT"
                message: "Formato de arquivo inválido. Por favor, envie um arquivo RTN válido."
        '401':
          description: Não autorizado - Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Arquivo muito grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Aluguel:
      type: object
      required:
        - dataAluguel
        - modeloCarro
        - kmCarro
        - nomeCliente
        - telefoneCliente
        - dataDevolucao
        - valor
        - pago
      properties:
        dataAluguel:
          type: string
          format: date
          description: Data do aluguel no formato DD/MM/YYYY
          example: "15/03/2024"
        modeloCarro:
          type: string
          description: Modelo do carro alugado
          example: "Gol G6"
        kmCarro:
          type: integer
          description: Quilometragem do carro no momento do aluguel
          example: 45000
          minimum: 0
        nomeCliente:
          type: string
          description: Nome completo do cliente
          example: "João Silva"
        telefoneCliente:
          type: string
          description: Telefone de contato do cliente
          example: "(11) 98765-4321"
        dataDevolucao:
          type: string
          format: date
          description: Data prevista para devolução no formato DD/MM/YYYY
          example: "20/03/2024"
        valor:
          type: number
          format: float
          description: Valor total do aluguel
          example: 350.00
          minimum: 0
        pago:
          type: string
          description: Status de pagamento do aluguel
          enum: [SIM, NAO]
          example: "SIM"

    Carro:
      type: object
      required:
        - id
        - modelo
      properties:
        id:
          type: integer
          description: Identificador único do carro
          example: 1
        modelo:
          type: string
          description: Modelo do carro
          example: "Gol G6"

    ListarAlugueisResponse:
      type: object
      properties:
        alugueis:
          type: array
          items:
            $ref: '#/components/schemas/Aluguel'
          description: Lista de aluguéis cadastrados
        valorTotalNaoPago:
          type: number
          format: float
          description: Soma total dos valores não pagos
          example: 200.00
          minimum: 0

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Código do erro
          example: "INVALID_REQUEST"
        message:
          type: string
          description: Mensagem descritiva do erro
          example: "Requisição inválida. Verifique os parâmetros enviados."
        timestamp:
          type: string
          format: date-time
          description: Data e hora do erro
          example: "2024-03-15T10:30:00Z"
        path:
          type: string
          description: Caminho da requisição que gerou o erro
          example: "/api/alugueis/listar"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Autenticação via token JWT obtido do Keycloak.
        Inclua o token no header Authorization: Bearer <token>

security:
  - bearerAuth: []

tags:
  - name: Aluguéis
    description: Operações relacionadas ao gerenciamento de aluguéis de veículos
  - name: Carros
    description: Operações relacionadas ao gerenciamento de carros disponíveis
